# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
jobs:
  # first cron
  hello-world:
    image:
      repository: hello-world
      tag: latest
      imagePullPolicy: IfNotPresent
    schedule: "* * * * *"
    failedJobsHistoryLimit: 1
    successfulJobsHistoryLimit: 3
    concurrencyPolicy: Allow
    restartPolicy: OnFailure
    imagePullSecrets:
    - username: fred
      password: password
      registry: docker.io
  # second cron
  hello-ubuntu:
    image:
      repository: ubuntu
      tag: latest
      imagePullPolicy: Always
    schedule: "*/5 * * * *"
    command: ["/bin/bash"]
    args:
      - "-c"
      - "echo $(date) - hello from ubuntu"
    resources:
      limits:
        cpu: 50m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 256Mi
    failedJobsHistoryLimit: 1
    successfulJobsHistoryLimit: 3
    concurrencyPolicy: Forbid
    restartPolicy: OnFailure
    imagePullSecrets:
    - username: joe
      password: password2
      email: joe@example.com
      registry: quay.io
  # third cron
  hello-env-var:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 2000
    image:
      repository: busybox
      tag: latest
      imagePullPolicy: Always
    # optional env vars
    env:
    - name: ECHO_VAR
      value: "busybox"
    envFrom:
    - secretRef:
        name: secret_data
    - configMapRef:
        name: config_data
    schedule: "* * * * *"
    command: ["/bin/sh"]
    args:
      - "-c"
      - "echo $(date) - hello from $ECHO_VAR"
      - "echo $(date) - loaded secret $secret_data"
      - "echo $(date) - loaded config $config_data"
    serviceAccount:
      name: "busybox-serviceaccount"
    resources:
      limits:
        cpu: 50m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 256Mi
    failedJobsHistoryLimit: 1
    successfulJobsHistoryLimit: 3
    concurrencyPolicy: Forbid
    restartPolicy: Never
    nodeSelector:
      type: infra
    tolerations:
    - effect: NoSchedule
      operator: Exists
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/e2e-az-name
              operator: In
              values:
              - e2e-az1
              - e2e-az2

# ─────────────────────────────────────────────────────────────────────────────
# Test configuration – used by 'helm test <release>'
# ─────────────────────────────────────────────────────────────────────────────
tests:
  enabled: true

  # Shared image used by all test pods; requires kubectl to be present.
  image:
    repository: bitnami/kubectl
    tag: "1.29"
    pullPolicy: IfNotPresent

  # Resource constraints applied to every test pod.
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Connectivity test – verifies all CronJob resources exist in the cluster.
  connectivity:
    enabled: true
    # Seconds before the test pod is force-killed.
    timeoutSeconds: 60

  # Configuration test – inspects the live CronJob spec to assert schedule,
  # image, and environment variables match the deployed values.
  configuration:
    enabled: true
    # Key from .Values.jobs whose spec will be inspected.
    jobName: hello-env-var
    # Environment variables expected to be present in the container spec.
    expectedEnvVars:
      - name: ECHO_VAR
        value: "busybox"
    timeoutSeconds: 60

  # Smoke test – triggers a one-off Job from the chosen CronJob and asserts
  # it exits 0 within timeoutSeconds.
  smoke:
    enabled: true
    # Key from .Values.jobs to trigger.  Choose a job with no imagePullSecrets
    # or one whose image is always publicly accessible.
    jobName: hello-ubuntu
    timeoutSeconds: 120
