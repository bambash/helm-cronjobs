# helm-cronjobs values
# Define one or more CronJobs under the `jobs` key.
# Each key becomes part of the CronJob name: <release>-<jobname>

# Optional: override the release name prefix used in resource names.
# nameOverride: ""

jobs: {}
# Uncomment and edit the examples below to get started.

# ------------------------------------------------------------------------------
# Minimal example
# ------------------------------------------------------------------------------
# hello-world:
#   image:
#     repository: busybox
#     tag: "1.36"
#     imagePullPolicy: IfNotPresent
#   schedule: "*/5 * * * *"
#   restartPolicy: OnFailure

# ------------------------------------------------------------------------------
# Full reference — all supported fields
# ------------------------------------------------------------------------------
# my-job:
#
#   ## Schedule (required) -------------------------------------------------
#   # Standard cron expression
#   schedule: "0 2 * * *"
#   # IANA timezone for the schedule (requires Kubernetes >= 1.27)
#   timeZone: "America/New_York"
#
#   ## Image (required) ----------------------------------------------------
#   image:
#     repository: my-registry.example.com/my-image
#     tag: "1.0.0"
#     imagePullPolicy: IfNotPresent   # Always | Never | IfNotPresent
#
#   ## CronJob-level controls -----------------------------------------------
#   suspend: false                    # Pause the schedule without deleting the CronJob
#   concurrencyPolicy: Forbid         # Allow | Forbid | Replace
#   failedJobsHistoryLimit: 1
#   successfulJobsHistoryLimit: 3
#   startingDeadlineSeconds: 300      # Deadline to start a missed job run
#
#   ## Job-level controls ---------------------------------------------------
#   backoffLimit: 3                   # Retry count before marking Job as failed
#   activeDeadlineSeconds: 600        # Max seconds a Job may run
#   ttlSecondsAfterFinished: 86400    # Auto-delete finished Jobs after N seconds
#
#   ## Container command & args --------------------------------------------
#   command: ["/bin/sh"]
#   args:
#     - "-c"
#     - "echo hello from $(date)"
#
#   ## Environment variables -----------------------------------------------
#   env:
#     - name: MY_VAR
#       value: "my-value"
#     - name: MY_SECRET_VAR
#       valueFrom:
#         secretKeyRef:
#           name: my-secret
#           key: my-key
#   envFrom:
#     - secretRef:
#         name: my-secret
#     - configMapRef:
#         name: my-configmap
#
#   ## Resource requests & limits ------------------------------------------
#   resources:
#     requests:
#       cpu: 100m
#       memory: 128Mi
#     limits:
#       cpu: 500m
#       memory: 512Mi
#
#   ## Pod security context (pod-level) ------------------------------------
#   securityContext:
#     runAsNonRoot: true
#     runAsUser: 1000
#     runAsGroup: 1000
#     fsGroup: 2000
#     seccompProfile:
#       type: RuntimeDefault
#
#   ## Container security context ------------------------------------------
#   containerSecurityContext:
#     allowPrivilegeEscalation: false
#     readOnlyRootFilesystem: true
#     capabilities:
#       drop: ["ALL"]
#
#   ## Service account -----------------------------------------------------
#   # If omitted a ServiceAccount named <release>-<jobname> is auto-created.
#   serviceAccount:
#     name: my-service-account
#     annotations:
#       eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/my-role
#
#   ## Pod annotations & extra labels --------------------------------------
#   podAnnotations:
#     prometheus.io/scrape: "false"
#   podLabels:
#     team: platform
#
#   ## Private registry credentials ----------------------------------------
#   # One Kubernetes Secret (type: kubernetes.io/dockerconfigjson) is created
#   # per release and shared across all jobs that specify imagePullSecrets.
#   imagePullSecrets:
#     - username: myuser
#       password: mypassword
#       registry: my-registry.example.com
#
#   ## Init containers ------------------------------------------------------
#   initContainers:
#     - name: wait-for-db
#       image: busybox:1.36
#       command: ["sh", "-c", "until nc -z db 5432; do sleep 2; done"]
#
#   ## Volumes & mounts -----------------------------------------------------
#   volumes:
#     - name: config
#       configMap:
#         name: my-configmap
#   volumeMounts:
#     - name: config
#       mountPath: /etc/config
#       readOnly: true
#
#   ## Scheduling controls -------------------------------------------------
#   restartPolicy: OnFailure          # OnFailure | Never
#   nodeSelector:
#     kubernetes.io/os: linux
#   tolerations:
#     - key: "dedicated"
#       operator: "Equal"
#       value: "batch"
#       effect: "NoSchedule"
#   affinity:
#     nodeAffinity:
#       requiredDuringSchedulingIgnoredDuringExecution:
#         nodeSelectorTerms:
#           - matchExpressions:
#               - key: topology.kubernetes.io/zone
#                 operator: In
#                 values:
#                   - us-east-1a
#   topologySpreadConstraints:
#     - maxSkew: 1
#       topologyKey: topology.kubernetes.io/zone
#       whenUnsatisfiable: DoNotSchedule
#       labelSelector:
#         matchLabels:
#           cron: my-job
#
#   ## Lifecycle hooks -------------------------------------------------------
#   lifecycle:
#     preStop:
#       exec:
#         command: ["/bin/sh", "-c", "sleep 5"]

